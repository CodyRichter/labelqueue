[project]
name = "labelqueue"
version = "0.1.0"
description = "Print server and web UI for a Bluetooth TSPL thermal label printer"
requires-python = ">=3.13"
# Pinned to Debian 13's packages: the VM runs these from apt, not from PyPI.
dependencies = [
    "fastapi==0.115.11",
    "uvicorn==0.32.0",
    "pillow==11.1.0",
    "segno==1.6.6",
]

[project.optional-dependencies]
ble = ["bleak==0.22.3"]

[dependency-groups]
dev = ["pytest==8.3.5", "httpx==0.28.1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
